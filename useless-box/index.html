<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <title>The Most Useless Box</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <a id="backLink" class="back-link" href="../index.html" data-i18n="back">← Вернуться в портфолио</a>
      <button id="langButton" class="ghost-btn" type="button" aria-label="Change language">RU / EN</button>
    </header>

    <section class="hero">
      <h1 data-i18n="title">Самая бесполезная коробка</h1>
      <p class="subtitle" data-i18n="subtitle">Нажми на тумблер. Она всё исправит.</p>
    </section>

    <section class="model-row" aria-label="Model selector">
      <span class="model-label" data-i18n="model">Модель</span>
      <button id="modelPrev" class="model-arrow" type="button" aria-label="Previous model">‹</button>
      <strong id="modelName" class="model-name">CLASSIC</strong>
      <button id="modelNext" class="model-arrow" type="button" aria-label="Next model">›</button>
    </section>

    <section class="stage-wrap">
      <div id="scene" class="scene pose-hidden" data-model="classic" aria-live="polite">
        <div class="floor-shadow"></div>

        <div class="box-body">
          <div class="front-inset"></div>
          <div class="body-highlight"></div>
        </div>

        <div class="cavity">
  <div class="cavity-back"></div>
</div>

        <div class="arm" id="arm" aria-hidden="true">
          <div class="arm-anchor"></div>
          <div class="arm-seg seg-a">
            <span class="joint joint-a"></span>
            <div class="arm-seg seg-b">
              <span class="joint joint-b"></span>
              <div class="arm-seg seg-c">
                <span class="joint joint-c"></span>
                <span class="pusher"></span>
              </div>
            </div>
          </div>
        </div>

        <div class="front-panel">
          <div class="panel-highlight"></div>
          <button id="switchButton" class="switch-control" type="button" aria-label="Toggle switch">
            <span class="switch-plate">
              <span class="switch-label switch-off">OFF</span>
              <span class="switch-label switch-on">ON</span>
              <span class="switch-socket">
                <span class="switch-lever"></span>
              </span>
            </span>
          </button>
        </div>

        <div class="cavity-lip"></div>

        <div class="lid" id="lid" aria-hidden="true">
          <span class="hinge hinge-left"></span>
          <span class="hinge hinge-right"></span>
          <span class="lid-highlight"></span>
        </div>

        <div class="raccoon-badge" aria-hidden="true">
          <span class="ear ear-left"></span><span class="ear ear-right"></span>
          <span class="mask"></span><span class="nose"></span>
        </div>

        <div id="reactionMessage" class="reaction-message" role="status"></div>
      </div>
    </section>

    <section class="status-row"><span data-i18n="presses">Нажатий</span>: <strong id="pressCount">0</strong></section>

    <section class="controls">
      <div class="control-group">
        <button id="musicToggle" class="control-btn" type="button">♫ <span data-i18n="music">Музыка</span>: <strong id="musicState">OFF</strong></button>
        <select id="trackSelect" class="track-select" aria-label="Music track"></select>
      </div>
      <div class="control-group">
        <button id="sfxToggle" class="control-btn" type="button">🔊 <span data-i18n="sfx">Звуки</span>: <strong id="sfxState">ON</strong></button>
      </div>
    </section>

    <p id="audioHint" class="audio-hint" data-i18n="audioHint">Музыка запускается после первого взаимодействия с сайтом.</p>

    <noscript><p class="noscript">Для работы коробки нужен JavaScript. Без него она наконец-то полезна.</p></noscript>
  </main>
  <script src="script.js"></script>
</body>
</html>
